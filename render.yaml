# LEFI: serviço e banco NOVOS. Nunca utilize o banco/credenciais da Klaus Pet.
services:
  - type: web
    name: lefi-loja
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn lefi.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lefi-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: '0'
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: LEFI_CHECKOUT_ENABLED
        value: '0'
      - key: LEFI_ACCEPT_MANUAL_ORDERS
        value: '0'
      - key: LEFI_EMAIL_ENABLED
        value: '0'
databases:
  - name: lefi-db
    plan: free
